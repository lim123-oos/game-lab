<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>痕迹实验室 · 现场</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1116;color:#e6e8ee;font-family:"Microsoft YaHei","PingFang SC",sans-serif;display:flex;justify-content:center;padding:24px}
#app{width:960px;max-width:100%}
h1{font-size:24px;margin-bottom:12px;letter-spacing:1px}
.steps{display:flex;gap:8px;margin-bottom:16px}
.step{flex:1;text-align:center;padding:8px;border-radius:6px;background:#1a1e26;color:#5c6474;font-size:13px;border:1px solid #232833}
.step.active{background:#2d5f8a;color:#fff;border-color:#3a75a8}
.step.done{background:#1e3a28;color:#7fcf9a;border-color:#2f5f3f}

/* ---------- 现场图容器 ---------- */
.scene{position:relative;height:420px;border-radius:10px;overflow:hidden;
  border:1px solid #2f3542;background:#12151b;margin-bottom:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.6)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 热点 ---------- */
.hotspot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2;
  display:flex;flex-direction:column;align-items:center;transition:.15s}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.1)}
.dot{width:30px;height:30px;border-radius:50%;border:2px dashed #8b93a5;
  background:rgba(20,24,32,.35);transition:.2s;position:relative}
.hotspot:hover .dot{border-color:#fff;background:rgba(255,255,255,.12)}
.dot.marked{border:2px solid #f0c840;background:rgba(240,200,64,.35);
  box-shadow:0 0 14px rgba(240,200,64,.7)}
.label{font-size:12px;color:#c8cfdd;white-space:nowrap;margin-top:5px;
  background:rgba(10,12,16,.75);padding:2px 7px;border-radius:4px;transition:.2s}
.label.marked{color:#f0c840;background:rgba(60,44,10,.9)}

/* ---------- 线索列表 ---------- */
.clue{font-size:13.5px;padding:7px 10px;margin-bottom:6px;border-left:3px solid #f0c840;
  background:rgba(240,200,64,.07);border-radius:0 5px 5px 0;color:#d8dde8;line-height:1.5}
.clue b{color:#f0c840}

/* ---------- 通用面板 ---------- */
.panel{background:#161a22;border:1px solid #262c38;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.bar{display:flex;gap:22px;align-items:center;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.msg{color:#f0a840;font-size:14px;min-height:20px;margin-bottom:10px}
button{font-family:inherit;font-size:15px;padding:10px 20px;border-radius:6px;border:none;
  cursor:pointer;background:#2d5f8a;color:#fff;transition:.15s}
button:hover{background:#3a75a8}
button:disabled{background:#2a2f3a;color:#5c6474;cursor:not-allowed}
button.gold{background:#8a6d1e}button.gold:hover{background:#a8842a}
button.ghost{background:#232833}button.ghost:hover{background:#2f3542}
.card{padding:13px 16px;border-radius:8px;border:2px solid #262c38;background:#161a22;
  margin-bottom:9px;cursor:pointer;transition:.15s;font-size:15px}
.card:hover{border-color:#4a5568;background:#1b2029}
.card.sel{border-color:#3fa55f;background:#152219}
.card.used{opacity:.4;cursor:not-allowed}
.card .ico{margin-right:8px}
.result{font-size:13.5px;color:#9be0a8;padding:9px 0;border-bottom:1px solid #232833;line-height:1.5}
.big{font-size:36px;font-weight:bold;color:#f0c840;margin:14px 0;text-shadow:0 0 20px rgba(240,200,64,.35)}
.note{font-size:13px;color:#7a8290;line-height:1.8}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* ---------- 观察镜 ---------- */
#lens{position:fixed;width:72px;height:72px;border-radius:50%;pointer-events:none;
  border:2px solid rgba(240,200,64,.4);box-shadow:inset 0 0 24px rgba(240,200,64,.15);
  transform:translate(-50%,-50%);z-index:999;display:none;transition:opacity .2s}
</style>
</head>
<body>
<div id="lens"></div>
<div id="app"></div>

<script>
/* ============================================================
   案件数据
   ============================================================ */
const CASE = {
  title: "案件 01 · 书房密室",
  requiredSignals: 2,
  budget: 2,
  hotspots: [
    {id:"h1", x:19, y:27, label:"窗户裂纹", signal:true,
     desc:"裂纹从内侧向外辐射，玻璃碎屑落在室内地板上"},
    {id:"h2", x:62, y:85, label:"地毯纤维", signal:true,
     desc:"纤维倒向门口方向，说明有人从门口快速经过"},
    {id:"h3", x:15, y:60, label:"墙上的画", signal:false,
     desc:"普通装饰画，与案件无关"},
    {id:"h4", x:83, y:31, label:"落地灯", signal:false,
     desc:"正常通电，灯罩内侧无异常"},
    {id:"h5", x:51, y:71, label:"书桌抽屉", signal:true,
     desc:"抽屉被撬，木屑落在桌外，说明从室内向外撬"}
  ],
  hypotheses: [
    {id:"a", text:"凶手破窗而入", truth:false},
    {id:"b", text:"凶手从门口进入，伪造破窗假象", truth:true}
  ],
  experiments: [
    {id:"e1", icon:"🔬", name:"玻璃碎片分布化验", supported:"b",
     result:"碎片全部落在室内侧，证明窗户是由内向外击打"},
    {id:"e2", icon:"🧪", name:"纤维方向显微分析", supported:"b",
     result:"纤维倒向与从门口进入的路径完全一致"},
    {id:"e3", icon:"🔍", name:"窗框指纹提取", supported:"a",
     result:"未提取到任何有效指纹（窗框被擦拭过）"},
    {id:"e4", icon:"📐", name:"抽屉撬痕角度分析", supported:"b",
     result:"撬痕角度与室内操作方向一致"}
  ]
};

const STEP_NAMES = ["观察","推断","验证","结案"];
const app = document.getElementById('app');
const lens = document.getElementById('lens');
let S;

/* ============================================================
   现场 SVG（内嵌矢量图，无外部文件依赖）
   ============================================================ */
const SCENE_SVG = `
<svg viewBox="0 0 960 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c414d"/><stop offset="1" stop-color="#2a2e37"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33291f"/><stop offset="1" stop-color="#191410"/>
    </linearGradient>
    <radialGradient id="lampG">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigG">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- 墙 / 墙裙 / 地板 -->
  <rect width="960" height="330" fill="url(#wallG)"/>
  <rect y="310" width="960" height="20" fill="#23272f"/>
  <rect y="330" width="960" height="90" fill="url(#floorG)"/>
  <g stroke="#0d0a08" stroke-width="1" opacity="0.5">
    <line x1="0" y1="356" x2="960" y2="356"/>
    <line x1="0" y1="386" x2="960" y2="386"/>
  </g>

  <!-- 窗户 + 裂纹 -->
  <g>
    <rect x="70" y="40" width="220" height="150" fill="#141c26" stroke="#4a3a2a" stroke-width="10"/>
    <line x1="180" y1="40" x2="180" y2="190" stroke="#4a3a2a" stroke-width="8"/>
    <line x1="70" y1="115" x2="290" y2="115" stroke="#4a3a2a" stroke-width="8"/>
    <circle cx="245" cy="68" r="13" fill="#dfe6f0" opacity="0.8"/>
    <g stroke="#c8d2e0" stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M180 115 L152 72 L136 62 M152 72 L122 80
               M180 115 L212 152 L228 162 M212 152 L242 142
               M180 115 L170 162 L158 178"/>
    </g>
  </g>

  <!-- 墙上的画 -->
  <g>
    <rect x="75" y="200" width="120" height="105" fill="#2a2f3a" stroke="#8a6d1e" stroke-width="6"/>
    <circle cx="112" cy="240" r="16" fill="#5a6a7a" opacity="0.7"/>
    <path d="M80 300 L115 258 L145 288 L190 248 L190 300 Z" fill="#3f4a58"/>
  </g>

  <!-- 落地灯 -->
  <g>
    <circle cx="800" cy="130" r="95" fill="url(#lampG)" filter="url(#soft)"/>
    <rect x="792" y="160" width="16" height="172" fill="#4a4a4a"/>
    <ellipse cx="800" cy="336" rx="42" ry="10" fill="#3a3a3a"/>
    <path d="M768 160 L832 160 L816 106 L784 106 Z" fill="#6a6a6a"/>
    <ellipse cx="800" cy="160" rx="32" ry="6" fill="#ffe9a8" opacity="0.75"/>
  </g>

  <!-- 书桌 + 抽屉 + 木屑 -->
  <g>
    <rect x="360" y="250" width="260" height="18" fill="#5a4228"/>
    <rect x="370" y="268" width="240" height="82" fill="#4a3520"/>
    <rect x="420" y="280" width="140" height="36" fill="#3a2a18" stroke="#2a1e10" stroke-width="2"/>
    <rect x="430" y="292" width="120" height="14" fill="#5a4228"/>
    <rect x="482" y="297" width="28" height="4" fill="#8a6d1e"/>
    <g fill="#7a5a30">
      <rect x="560" y="316" width="7" height="2" transform="rotate(18 563 317)"/>
      <rect x="570" y="322" width="6" height="2" transform="rotate(-12 573 323)"/>
      <rect x="578" y="312" width="5" height="2" transform="rotate(32 580 313)"/>
    </g>
  </g>

  <!-- 地毯 + 纤维痕迹 -->
  <g>
    <path d="M120 360 Q480 340 840 360 L860 420 L100 420 Z" fill="#4a2020" opacity="0.9"/>
    <path d="M120 360 Q480 340 840 360" stroke="#6a3030" stroke-width="3" fill="none"/>
    <path d="M480 372 Q530 366 610 382" stroke="#7a4040" stroke-width="2" fill="none" opacity="0.85"/>
  </g>

  <!-- 室内侧玻璃碎片 -->
  <g fill="#b8c8d8" opacity="0.75">
    <polygon points="205,345 213,341 215,349"/>
    <polygon points="235,358 241,354 243,361"/>
    <polygon points="258,350 264,347 265,353"/>
    <polygon points="188,368 194,365 195,371"/>
    <polygon points="272,368 277,365 278,370"/>
  </g>

  <!-- 暗角 + 照片颗粒感 -->
  <rect width="960" height="420" fill="url(#vigG)"/>
  <rect width="960" height="420" filter="url(#grain)" opacity="0.05"/>
</svg>`;

/* ============================================================
   状态与流程
   ============================================================ */
function reset(){
  S = {phase:'observe', marked:new Set(), wrong:0,
       hyp:null, budget:CASE.budget, results:[], message:''};
  render();
}

function stepBar(){
  const idx = {observe:0, hypothesis:1, experiment:2, report:3}[S.phase];
  return '<div class="steps">' + STEP_NAMES.map((n,i)=>
    `<div class="step ${i===idx?'active':(i<idx?'done':'')}">${i+1}. ${n}</div>`
  ).join('') + '</div>';
}

/* ---------- 阶段 1：观察 ---------- */
function observeHTML(){
  const hs = CASE.hotspots.map(h=>{
    const m = S.marked.has(h.id);
    return `<div class="hotspot" style="left:${h.x}%;top:${h.y}%"
              onclick="markHotspot('${h.id}')">
      <div class="dot ${m?'marked':''}"></div>
      <div class="label ${m?'marked':''}">${h.label}</div>
    </div>`;
  }).join('');

  const clues = [...S.marked].map(id=>{
    const h = CASE.hotspots.find(x=>x.id===id);
    return `<div class="clue">🔍 <b>${h.label}</b> — ${h.desc}</div>`;
  }).join('') || '<div class="note">尚未发现任何关键线索。移动鼠标观察现场细节。</div>';

  return `
    <h1>${CASE.title}</h1>
    ${stepBar()}
    <div class="panel" style="padding:11px 16px;font-size:13.5px;color:#8b93a5">
      点击现场中的可疑位置进行标记。标记无关细节会扣分——这是训练区分「信号」与「噪声」。
    </div>
    <div class="scene">${SCENE_SVG}${hs}</div>
    <div class="panel">
      <div class="bar">
        <span>关键线索 <b style="color:#f0c840">${S.marked.size}</b> / 需 ${CASE.requiredSignals}</span>
        <span>误标 <b style="color:#e06a6a">${S.wrong}</b></span>
      </div>
      ${clues}
    </div>
    <div class="msg">${S.message}</div>
    <div class="row"><button onclick="goHypothesis()">进入推断阶段 →</button></div>`;
}

function markHotspot(id){
  if(S.marked.has(id)) return;
  const h = CASE.hotspots.find(x=>x.id===id);
  if(h.signal){
    S.marked.add(id);
    S.message = '🔍 发现线索：' + h.desc;
  }else{
    S.wrong++;
    S.message = '✗ 这只是无关细节（误标 -1）：' + h.desc;
  }
  render();
}

/* ---------- 阶段 2：推断 ---------- */
function hypHTML(){
  const cards = CASE.hypotheses.map(h=>`
    <div class="card ${S.hyp===h.id?'sel':''}" onclick="chooseHyp('${h.id}')">
      ${S.hyp===h.id?'✓':'○'} ${h.text}
    </div>`).join('');
  return `
    <h1>${CASE.title}</h1>
    ${stepBar()}
    <div class="panel">
      <div class="note" style="margin-bottom:14px">
        基于你标记的线索，选择一个可检验的假设。注意：证据只能「支持」假设，不能直接证明真相。
      </div>
      ${cards}
    </div>
    <div class="msg">${S.message}</div>
    <div class="row">
      <button ${S.hyp?'':'disabled'} onclick="goExperiment()">设计验证实验 →</button>
    </div>`;
}

function chooseHyp(id){ S.hyp = id; render(); }

/* ---------- 阶段 3：预测-验证 ---------- */
function expHTML(){
  const list = CASE.experiments.map(e=>{
    const used = S.results.some(r=>r.id===e.id);
    return `<div class="card ${used?'used':''}" onclick="runExp('${e.id}')">
      <span class="ico">${e.icon}</span>${used?'✓ 已完成：':'○ '}${e.name}
    </div>`;
  }).join('');

  const res = S.results.map(r=>`<div class="result">• ${r.result}</div>`).join('')
    || '<div class="note">尚未进行任何实验。</div>';

  return `
    <h1>${CASE.title}</h1>
    ${stepBar()}
    <div class="bar">
      <span>剩余实验次数 <b style="color:#f0c840">${S.budget}</b></span>
      <span class="note">资源有限，请优先验证能「区分两个假设」的实验。</span>
    </div>
    <div class="panel">${list}</div>
    <div class="panel">
      <div style="margin-bottom:8px;color:#8b93a5;font-size:13px">实验结果</div>
      ${res}
    </div>
    <div class="msg">${S.message}</div>
    <div class="row">
      <button class="${S.results.length?'gold':''}" ${S.results.length?'':'disabled'}
        onclick="goReport()">提交结案报告 →</button>
    </div>`;
}

function runExp(id){
  if(S.budget<=0 || S.results.some(r=>r.id===id)) return;
  const e = CASE.experiments.find(x=>x.id===id);
  S.budget--;
  S.results.push(e);
  S.message = '实验完成：' + e.result;
  render();
}

/* ---------- 阶段 4：结案 ---------- */
function reportHTML(){
  const hyp = CASE.hypotheses.find(h=>h.id===S.hyp);
  const truth = CASE.hypotheses.find(h=>h.truth);
  const supported = S.results.some(r=>r.supported===S.hyp);

  const score = S.marked.size*15 - S.wrong*10
              + (supported?20:0) + (S.hyp===truth.id?30:0);

  const detail = [];
  detail.push(`有效线索标记 ${S.marked.size} 个：+${S.marked.size*15}`);
  if(S.wrong) detail.push(`误标无关细节 ${S.wrong} 个：-${S.wrong*10}`);
  detail.push(supported
    ? '你的实验支持了所选假设：+20'
    : '没有实验支持你的假设：+0');
  detail.push(S.hyp===truth.id
    ? '假设与真相一致：+30'
    : '假设与真相不符：+0');

  return `
    <h1>结案报告</h1>
    ${stepBar()}
    <div class="panel">
      <div class="note">你选择的假设</div>
      <div style="font-size:17px;margin:6px 0 16px">${hyp.text}</div>
      <div class="note">完成的实验</div>
      <div style="margin:6px 0 16px;line-height:1.9">
        ${S.results.map(r=>'· '+r.name).join('<br>') || '无'}
      </div>
      <div class="note">评分明细</div>
      <div style="margin:6px 0;line-height:1.9">${detail.join('<br>')}</div>
    </div>
    <div class="panel">
      <div class="note">本案真相</div>
      <div style="font-size:16px;margin:6px 0 10px">${truth.text}</div>
      <div class="note">
        评分依据是「证据支持度」，而不是是否猜中——现实中，正确结论也必须由证据支撑。
      </div>
    </div>
    <div class="big">综合得分：${score}</div>
    <div class="row"><button class="ghost" onclick="reset()">重新开始</button></div>`;
}

/* ============================================================
   流程控制
   ============================================================ */
function goHypothesis(){
  if(S.marked.size < CASE.requiredSignals){
    S.message = `至少标记 ${CASE.requiredSignals} 个关键线索才能进入推断`;
    render(); return;
  }
  S.phase = 'hypothesis'; S.message = ''; render();
}
function goExperiment(){ S.phase = 'experiment'; S.message = ''; render(); }
function goReport(){ S.phase = 'report'; S.message = ''; render(); }

/* ============================================================
   渲染 + 观察镜
   ============================================================ */
function render(){
  lens.style.display = (S.phase === 'observe') ? 'block' : 'none';

  if(S.phase === 'observe')          app.innerHTML = observeHTML();
  else if(S.phase === 'hypothesis')  app.innerHTML = hypHTML();
  else if(S.phase === 'experiment')  app.innerHTML = expHTML();
  else                               app.innerHTML = reportHTML();
}

document.addEventListener('mousemove', e=>{
  lens.style.left = e.clientX + 'px';
  lens.style.top  = e.clientY + 'px';
});

reset();
</script>
</body>
</html>
